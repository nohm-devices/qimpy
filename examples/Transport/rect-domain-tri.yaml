# rect-domain driven by source/drain contacts, solved with the finite-volume
# triangle-mesh transport (spatial_transport). The mesh is supplied externally (qimpy does
# not mesh); generate it first with:
#     python make_rect_mesh.py --out rect-domain-tri.npz
fermi_surface:
  kF: 1.0
  vF: 1.5
  M_theta: 12
  Nr: 1
  tau_p: .inf
  tau_ee: .inf
  r_c: 10.0

geometry:
  mesh:
    file: rect-domain-mesh.h5
  compile: true
  contacts:
    source:
      dmu: +0.1
    drain:
      dmu: -0.1

time_evolution:
  t_max: 100.0
  dt_save: 100.0
  n_collate: 32

checkpoint: null
checkpoint_out: animation/advect_{:04d}.h5
